version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Maps port 8082 on your host machine to port 8080 in the 'app' container.
      - "8082:8080"
    environment:
      NODE_ENV: production
      PORT: 8080 # Consistent with Dockerfile
      REDIS_URL: redis://redis:6379 # Connect to the Redis service
      # Add any other necessary environment variables from .env or config for the app
      # For example, if ELASTIC_APM_SERVER_URL is needed:
      # ELASTIC_APM_SERVER_URL: http://your-apm-server:8200
    depends_on:
      - redis
    networks:
      - app-network

  redis:
    image: "redis:6-alpine" # Using a version compatible with redis@3.x.x client
    ports:
      # Optionally maps port 6380 on your host to port 6379 in the 'redis' container.
      # This allows you to connect to Redis from your host machine if needed for debugging.
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network

volumes:
  redis-data:

networks:
  app-network:
    driver: bridge
