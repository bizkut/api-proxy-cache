version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080" # Expose the port defined in Dockerfile and used by the app
    environment:
      NODE_ENV: production
      PORT: 8080 # Consistent with Dockerfile
      REDIS_URL: redis://redis:6379 # Connect to the Redis service
      # Add any other necessary environment variables from .env or config for the app
      # For example, if ELASTIC_APM_SERVER_URL is needed:
      # ELASTIC_APM_SERVER_URL: http://your-apm-server:8200
    depends_on:
      - redis
    networks:
      - app-network

  redis:
    image: "redis:6-alpine" # Using a version compatible with redis@3.x.x client
    ports:
      - "6379:6379" # Optional: expose Redis port to host for debugging
    volumes:
      - redis-data:/data
    networks:
      - app-network

volumes:
  redis-data:

networks:
  app-network:
    driver: bridge
